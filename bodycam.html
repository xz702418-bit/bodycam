<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bodycam</title>
<style>
:root{--p:#161a14;--p2:#20261d;--ln:#343c30;--tx:#c9d1c4;--dm:#8a9486;--g:#86b36f;--r:#e5392f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:14px system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain}
button,select{font:inherit}
.b{height:44px;min-width:76px;padding:0 12px;background:rgba(14,18,12,.75);color:var(--g);border:1px solid var(--g);border-radius:4px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:16px 10px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:3}
.op #bar{background:var(--p)}
#rb{width:70px;height:70px;border-radius:50%;border:3px solid var(--tx);background:none;padding:0;display:grid;place-items:center}
#rb span{width:52px;height:52px;border-radius:50%;background:var(--r);transition:.15s}
.rec #rb span{width:26px;height:26px;border-radius:5px}
.rec #bar .b{visibility:hidden}
#dot{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;width:9px;height:9px;border-radius:50%;background:var(--r);display:none}
.rec #dot{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:76%;overflow:auto;background:var(--p);border-top:1px solid var(--g);padding:4px 16px calc(112px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;z-index:2}
.op #sheet{transform:none}
h4{margin:18px 0 8px;font-size:12px;font-weight:600;color:var(--dm)}
.row{display:flex;gap:8px}
#sheet button{flex:1;height:38px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px}
#sheet button.on{border-color:var(--g);color:var(--g)}
label{display:block;font-size:13px;color:var(--tx);margin-bottom:12px}
label b{float:right;color:var(--g);font:12px ui-monospace,Menlo,monospace}
input[type=range]{width:100%;accent-color:var(--g);margin:6px 0 0}
select{width:100%;margin-top:6px;height:38px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#cnt{position:fixed;inset:0;display:none;place-items:center;font:30vmin ui-monospace,Menlo,monospace;color:var(--g);pointer-events:none;z-index:5}
#msg{position:fixed;top:calc(36px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;background:rgba(0,0,0,.8);border:1px solid var(--ln);padding:10px;display:none;z-index:6}
#fr{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border:2px solid var(--g);border-radius:50%;display:none;pointer-events:none;z-index:4}
#pv{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
#pv.on{display:flex}
#pv video{flex:1;min-height:0;width:100%;object-fit:contain}
.pb{display:flex;gap:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.pb .b{flex:1}
</style></head><body>
<canvas id="cv"></canvas>
<video id="vd" playsinline muted autoplay style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<div id="dot"></div><div id="msg"></div><div id="cnt"></div><div id="fr"></div>

<div id="sheet">
 <h4>Presets</h4><div class="row" id="pre"></div>
 <h4>Lente</h4><div class="row"><button data-lens="0">Ojo de pez</button><button data-lens="1">Gran angular</button></div>
 <h4>Efectos</h4><div id="sl"></div>
 <h4>Captura</h4>
 <div class="g2">
  <label>Resolución<select id="res"><option value="240">240p</option><option value="360">360p</option><option value="480">SD 480p</option><option value="720" selected>HD 720p</option><option value="1080">Full HD 1080p</option><option value="1440">QHD 1440p</option><option value="2160">4K</option></select></label>
  <label>Cuadros por segundo<select id="fps"><option>24</option><option selected>30</option><option>60</option></select></label>
  <label>Formato<select id="fmt"><option value="auto">Automático</option><option value="mp4">MP4</option><option value="webm">WebM</option></select></label>
  <label>Cuenta regresiva<select id="cds"><option value="0">Sin cuenta</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
 </div>
 <div class="row"><button id="au"></button></div>
</div>

<div id="bar">
 <button class="b" id="st">Ajustes</button>
 <button class="b" id="or"></button>
 <button id="rb" aria-label="Grabar"><span></span></button>
 <button class="b" id="sw">Cámara</button>
</div>

<div id="pv"><video id="pvv" controls playsinline></video>
 <div class="pb"><button class="b" id="ds">Descartar</button><button class="b" id="sv">Guardar</button></div></div>

<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const cv=$('#cv'),vd=$('#vd'),pvv=$('#pvv'),pv=$('#pv'),B=document.body;
const S={face:'environment',land:false,res:720,fps:30,fmt:'auto',cd:0,aud:true,lens:1,amt:.7,vig:.35,gr:.25,ca:.15,con:1.1,sat:.85};
const P={Bodycam:{lens:1,amt:.7,vig:.35,gr:.25,ca:.15,con:1.1,sat:.85},GoPro:{lens:0,amt:.55,vig:.15,gr:0,ca:.05,con:1.15,sat:1.2},VHS:{lens:0,amt:.25,vig:.4,gr:.5,ca:.6,con:.95,sat:.7}};
const SL=[['amt','Intensidad',0,1],['vig','Viñeta',0,1],['gr','Grano',0,1],['ca','Aberración cromática',0,1],['con','Contraste',.5,1.8],['sat','Color',0,2]];
const L={mp4:['video/mp4;codecs=avc1,mp4a.40.2','video/mp4'],webm:['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']};
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',4500)}

/* ---------- WebGL: lente + filtros (se graban en el archivo) ---------- */
const gl=cv.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance'});
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D t,nz;
uniform vec2 kk,off;uniform float oa,lens,amt,vig,gr,ca,con,sat;
vec3 S(vec2 c){return texture2D(t,c*.5*kk+.5).rgb;}
void main(){
 vec2 c=(v-.5)*2.,a=vec2(oa,1.);float rc=length(a);
 vec2 q=c*a/rc;float r2=dot(q,q);
 float k=amt*3.5,f=lens<.5?1.+k*r2:1.+k*r2*r2;f/=1.+k;
 vec2 c2=q*f*rc/a;
 vec3 col;
 if(ca>.003){float s=ca*.03*(.3+r2);col=vec3(S(c2*(1.+s)).r,S(c2).g,S(c2*(1.-s)).b);}else col=S(c2);
 col=(col-.5)*con+.5;
 col=mix(vec3(dot(col,vec3(.299,.587,.114))),col,sat);
 if(vig>.003)col*=1.-vig*smoothstep(.35,1.,sqrt(r2));
 if(gr>.003)col+=(texture2D(nz,v*vec2(oa,1.)*3.75+off).r-.5)*gr*.4;
 gl_FragColor=vec4(col,1.);}`;
function mk(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const ap=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
const UN={};['oa','kk','off','nz','t','lens','amt','vig','gr','ca','con','sat'].forEach(n=>UN[n]=gl.getUniformLocation(pr,n));
gl.uniform1i(UN.t,0);gl.uniform1i(UN.nz,1);
gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
{const d=new Uint8Array(16384);for(let i=0;i<16384;i++)d[i]=Math.random()*256;
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,128,128,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,d);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true)}
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.NEAREST));
gl.activeTexture(gl.TEXTURE0);
function dims(){const h=S.res,w=Math.round(h*16/9/2)*2;return S.land?[w,h]:[h,w]}
/* Vista previa liviana (480p) mientras no grabo; resolución completa solo al grabar */
let REC=false,tw=0,th=0;
const KS=['lens','amt','vig','gr','ca','con','sat'];
function cs(){const[w,h]=dims();if(REC)return[w,h];const k=Math.min(1,480/Math.min(w,h));return[Math.round(w*k/2)*2,Math.round(h*k/2)*2]}
function fit(){const[w,h]=cs();if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}return[w,h]}
function draw(){
 if(document.hidden||pv.classList.contains('on')||vd.readyState<2||!vd.videoWidth)return;
 const[w,h]=fit(),vw=vd.videoWidth,vh=vd.videoHeight,oa=w/h,va=vw/vh;
 if(tw!=vw||th!=vh){tw=vw;th=vh;gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vd)}
 else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,vd);
 gl.uniform1f(UN.oa,oa);gl.uniform2f(UN.kk,va>oa?oa/va:1,va>oa?1:va/oa);gl.uniform2f(UN.off,Math.random(),Math.random());
 for(const k of KS)gl.uniform1f(UN[k],S[k]);
 gl.drawArrays(gl.TRIANGLES,0,3);
}
/* Se dibuja solo cuando la cámara entrega un cuadro nuevo */
(function loop(){const f=()=>{try{draw()}catch(e){}loop()};vd.requestVideoFrameCallback?vd.requestVideoFrameCallback(f):requestAnimationFrame(f)})();

/* ---------- Cámara, pantalla encendida, enfoque táctil ---------- */
let stream,wl;
async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
async function startCam(){
 stream&&stream.getTracks().forEach(t=>t.stop());
 if(!navigator.mediaDevices)return msg('La cámara necesita https o localhost.');
 const[w,h]=dims();
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:S.face},width:{ideal:Math.max(w,h)},height:{ideal:Math.min(w,h)},frameRate:{ideal:S.fps}}});
  vd.srcObject=stream;await vd.play();lock();
 }catch(e){msg('Cámara no disponible ('+e.name+'). Da permiso y abre la página con https o localhost.')}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lock();const t=stream&&stream.getVideoTracks()[0];if(!t||t.readyState=='ended')startCam()}});
cv.onclick=e=>{
 B.classList.remove('op');
 const r=cv.getBoundingClientRect(),ar=cv.width/cv.height;let dw=r.width,dh=r.height;
 if(r.width/r.height>ar)dw=dh*ar;else dh=dw/ar;
 const x=(e.clientX-r.left-(r.width-dw)/2)/dw,y=(e.clientY-r.top-(r.height-dh)/2)/dh;
 if(x<0||x>1||y<0||y>1||!stream)return;
 const f=$('#fr');f.style.cssText=`display:block;left:${e.clientX}px;top:${e.clientY}px`;setTimeout(()=>f.style.display='none',700);
 const va=vd.videoWidth/vd.videoHeight,cx=va>ar?ar/va:1,cy=va>ar?1:va/ar;
 stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'single-shot',pointsOfInterest:[{x:.5+(x-.5)*cx,y:.5+(y-.5)*cy}]}]}).catch(()=>{});
};

/* ---------- Beep ---------- */
let ac;
function beep(n){for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+i*.2;
 o.frequency.value=n>1?700:1000;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.2,s);g.gain.setValueAtTime(0,s+.12);o.start(s);o.stop(s+.13)}}

/* ---------- Grabación ---------- */
let rec,chunks,mic,tk=0,url,ext,n=0;
const okF=f=>window.MediaRecorder&&L[f].some(m=>MediaRecorder.isTypeSupported(m));
function mime(){for(const f of S.fmt=='auto'?['mp4','webm']:[S.fmt])for(const m of L[f])if(MediaRecorder.isTypeSupported(m))return m;return''}
async function go(){
 ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
 if(rec)return stop();
 if(tk){tk=0;$('#cnt').style.display='none';return}
 if(!window.MediaRecorder)return msg('Este navegador no puede grabar video.');
 B.classList.remove('op');
 const my=tk=Date.now();
 for(let i=S.cd;i>0;i--){$('#cnt').textContent=i;$('#cnt').style.display='grid';await wait(1000);if(tk!=my)return}
 $('#cnt').style.display='none';tk=0;start();
}
async function start(){
 REC=true;fit();const ms=cv.captureStream(S.fps);
 if(S.aud){try{mic=await navigator.mediaDevices.getUserMedia({audio:true});mic.getAudioTracks().forEach(t=>ms.addTrack(t))}
  catch(e){S.aud=false;sync();msg('Micrófono no disponible, grabo sin audio.')}}
 const[w,h]=dims(),m=mime();
 try{rec=new MediaRecorder(ms,{mimeType:m||undefined,videoBitsPerSecond:Math.min(1.6e7,Math.max(1.2e6,w*h*S.fps*.08))})}
 catch(e){REC=false;return msg('No se pudo grabar con esa configuración: '+e.message)}
 chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=done;
 beep(1);rec.start(1000);B.classList.add('rec');
}
function stop(){
 if(rec.state!='inactive')rec.stop();
 beep(2);mic&&mic.getTracks().forEach(t=>t.stop());B.classList.remove('rec');
}
function done(){
 REC=false;const type=rec.mimeType||'video/webm';ext=type.includes('mp4')?'mp4':'webm';rec=null;
 url&&URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type}));
 pvv.src=url;pv.classList.add('on');pvv.play().catch(()=>{});
}
$('#ds').onclick=()=>{pv.classList.remove('on');pvv.pause();pvv.removeAttribute('src');url&&URL.revokeObjectURL(url);url=0};
$('#sv').onclick=async()=>{
 const name='bodycam_'+(++n)+'.'+ext,close=()=>{pv.classList.remove('on');pvv.pause()};
 try{const d=window.claude&&await claude.use('downloads');
  if(d)await d.save({filename:name,data:new Blob(chunks)});
  else{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
 }catch(e){if(e&&e.code!='declined')msg('No se pudo guardar el video.');return}
 setTimeout(close,700)};

/* ---------- Interfaz ---------- */
$('#sl').innerHTML=SL.map(([k,t,a,b])=>`<label>${t}<b id="v_${k}"></b><input type="range" id="s_${k}" min="${a}" max="${b}" step=".01"></label>`).join('');
SL.forEach(([k])=>$('#s_'+k).oninput=e=>{S[k]=+e.target.value;sync()});
$('#pre').innerHTML=Object.keys(P).map(k=>`<button data-p="${k}">${k==='GoPro'?'GoPro':k}</button>`).join('');
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{Object.assign(S,P[b.dataset.p]);sync()});
document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{S.lens=+b.dataset.lens;sync()});
function sync(){
 SL.forEach(([k])=>{$('#s_'+k).value=S[k];$('#v_'+k).textContent=S[k].toFixed(2)});
 document.querySelectorAll('[data-lens]').forEach(b=>b.classList.toggle('on',+b.dataset.lens==S.lens));
 $('#au').textContent='Audio: '+(S.aud?'activado':'desactivado');$('#au').classList.toggle('on',S.aud);
 $('#or').textContent=S.land?'Horizontal':'Vertical';
}
$('#res').onchange=e=>{S.res=+e.target.value;startCam()};
$('#fps').onchange=e=>{S.fps=+e.target.value;startCam()};
$('#fmt').onchange=e=>S.fmt=e.target.value;
$('#cds').onchange=e=>S.cd=+e.target.value;
[...$('#fmt').options].forEach(o=>{if(o.value!='auto'&&!okF(o.value))o.disabled=true});
$('#au').onclick=()=>{S.aud=!S.aud;sync()};
$('#or').onclick=()=>{S.land=!S.land;sync()};
$('#st').onclick=()=>B.classList.toggle('op');
$('#sw').onclick=()=>{S.face=S.face=='user'?'environment':'user';startCam()};
$('#rb').onclick=go;
sync();startCam();
</script></body></html>
